# Portainer Media Stack Configuration (mediastack, Portainer stack 1)
# Copied from the live Portainer editor on 2026-11-18, after Gluetun was re-enabled.
# Secrets come from Portainer env vars (${...}); none are stored here.
# Public copy: one private service is left out. The full live stack is in /home/media/stack-media-full.yml (not in the repo).

version: "3.9"
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    privileged: true
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}
      - XDG_CACHE_HOME=/cache
    volumes:
      - /home/media/docker/jellyfin/config:/config
      - /home/media/docker/jellyfin/cache:/cache
      - /mnt/media:/data
    ports:
      - "8096:8096"
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/video19:/dev/video19
      - /dev/video20:/dev/video20
      - /dev/video21:/dev/video21
      - /dev/video22:/dev/video22
      - /dev/video23:/dev/video23
      - /dev/video24:/dev/video24
      - /dev/video25:/dev/video25
      - /dev/video26:/dev/video26
      - /dev/video27:/dev/video27
      - /dev/video28:/dev/video28
      - /dev/video29:/dev/video29
      - /dev/video30:/dev/video30
      - /dev/video31:/dev/video31
      - /dev/video32:/dev/video32
      - /dev/video33:/dev/video33
      - /dev/video34:/dev/video34
      - /dev/video35:/dev/video35
      - /dev/video36:/dev/video36
      - /dev/video37:/dev/video37
    group_add:
      - "992"
      - "44"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /home/media/docker/qbittorrent/config:/config
      - /mnt/media/Downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/sonarr/config:/config
      - /mnt/media/TV-Shows:/tv
      - /mnt/media/Downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/"]
      interval: 1m
      timeout: 10s
      retries: 3

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/radarr/config:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/Downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/"]
      interval: 1m
      timeout: 10s
      retries: 3

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"   # all Prowlarr traffic via VPN; port 9696 published on gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/prowlarr/config:/config
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/bazarr/config:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/TV-Shows:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - "5055:5055"
    volumes:
      # Same host config path as Jellyseerr; first Seerr start migrates in place
      - /home/media/docker/jellyseerr/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"


  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /home/media/docker/gluetun/config:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Switzerland
      - HTTPPROXY=on          # Prowlarr indexer proxy: gluetun:8888, docker network only
      - TZ=${TZ}
    ports:
      - "9696:9696"           # Prowlarr (lives in gluetun's network namespace)
      - "8191:8191"           # FlareSolverr (lives in gluetun's network namespace)
    restart: unless-stopped
    # ponytail: no watchtower label on purpose. Recreating gluetun orphans prowlarr's and
    # flaresolverr's network. Update by hand: pull gluetun, update stack, restart both.

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - MAX_CONCURRENCY=2
      - TZ=${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  glance-local:
    image: glanceapp/glance:latest
    container_name: glance-local
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - TS_HOST=${TS_HOST}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - JELLYSTAT_API_KEY=${JELLYSTAT_API_KEY}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - CHANGEME_PIHOLE_PASSWORD=${CHANGEME_PIHOLE_PASSWORD}
    volumes:
      - /home/media/docker/glance-local/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
    ports:
      - "192.168.29.160:8280:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  glance-ts:
    image: glanceapp/glance:latest
    container_name: glance-ts
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - TS_HOST=${TS_HOST}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - JELLYSTAT_API_KEY=${JELLYSTAT_API_KEY}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - CHANGEME_PIHOLE_PASSWORD=${CHANGEME_PIHOLE_PASSWORD}
    volumes:
      - /home/media/docker/glance-ts/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
    ports:
      - "100.80.146.24:8280:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
    volumes:
      - /home/media/docker/recyclarr/config:/config
    depends_on:
      - radarr
      - prowlarr
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  jellystat-db:
    image: postgres:15-alpine
    container_name: jellystat-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jellystat
      - POSTGRES_USER=jellystat
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/jellystat/db:/var/lib/postgresql/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    ports:
      - "8095:3000"
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - POSTGRES_USER=jellystat
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/jellystat/config:/app/backend/backup-data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - jellyfin
      - jellystat-db

  jdownloader2:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader2
    restart: unless-stopped
    environment:
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/media/docker/jdownloader2/config:/config
      - /mnt/media/Downloads/jdownloader:/output
    ports:
      - "5800:5800"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 86400
    environment:
      - TZ=${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  default:
    name: mediacenter_default
